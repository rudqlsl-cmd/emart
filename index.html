  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },

            emartGreen: '#4B7A3B',

    html {
      scroll-behavior: smooth;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #222222;
      background-color: #F3F4F6;
    }
    body {
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    /* 말풍선 스티커 꼬리 */
    .sticker-bubble {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #FFFDF7;
      border: 1.5px solid #FFB81C;
      border-bottom-width: 4px;
      border-radius: 9999px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 13px;
      color: #222222;
      box-shadow: 0 2px 6px rgba(255, 184, 28, 0.15);
    }
    /* 고객 불편 말풍선 꼬리 */
    .quote-bubble {
      position: relative;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
    }
    .quote-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 24px;
      width: 14px;
      height: 14px;
      background: #F8FAFC;
      border-right: 1px solid #E2E8F0;
      border-bottom: 1px solid #E2E8F0;
      transform: rotate(45deg);
    }
    /* 부드러운 페이드 전환 */
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* 스크롤바 숨김 (필터 칩 영역) */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-100 text-[#222222] selection:bg-[#FFB81C]/30">

  <!-- 모바일 프레임 컨테이너 (최대 430px, PC 중앙 정렬) -->

    const ITEMS_DATA = {

        ],
        collaborators: '이마트 상품관리팀 · 산지 협력사',
        resultMetric: '교환 문의 30% ↓',
        resultNote: '목표',
        beforeSvg: `
          <svg viewBox="0 0 140 90" class="w-full h-24 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="26" y="24" width="88" height="54" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
            <line x1="26" y1="51" x2="114" y2="51" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 3"/>
            <!-- 윗줄 귤 -->
            <circle cx="46" cy="38" r="9" fill="#9CA3AF"/>
            <circle cx="70" cy="38" r="9" fill="#9CA3AF"/>
            <circle cx="94" cy="38" r="9" fill="#9CA3AF"/>
            <!-- 아래층 미확인 곰팡이 귤 -->
            <circle cx="46" cy="64" r="9" fill="#9CA3AF"/>

            <circle cx="94" cy="38" r="9" fill="#F59E0B"/>
            <circle cx="46" cy="64" r="9" fill="#F59E0B"/>
            <circle cx="70" cy="64" r="9" fill="#F59E0B"/>
            <circle cx="94" cy="64" r="9" fill="#F59E0B"/>
            <!-- 체크 배지 -->
            <circle cx="114" cy="22" r="11" fill="#4B7A3B"/>

      },
      mackerel: {
        id: 'mackerel',
        emoji: '🐟',
        name: '고등어',
        completedDate: '2026년 11월 개선 완료',
        stage: '보관',
        complaint: '받았을 때 살이 물렀어요',
        source: '바로퀵 주문 고객 · 10월 고객센터 문의',
        beforeText: '진열 중 온도가 오르내렸어요',
        afterText: '온도 점검을 늘리고 출고 직전 보랭팩을 넣어요',
        changes: [
          '진열 냉장 온도 점검 횟수 늘림',

        ],
        collaborators: '이마트 수산 파트 · 물류 담당',
        resultMetric: '교환 문의 30% ↓',
        resultNote: '목표',
        beforeSvg: `
          <svg viewBox="0 0 140 90" class="w-full h-24 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="20" width="100" height="56" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
            <!-- 오르내리는 온도 그래프 -->
            <path d="M32 58L52 36L72 56L92 32L108 50" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        `,
        afterSvg: `
          <svg viewBox="0 0 140 90" class="w-full h-24 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="20" width="100" height="56" rx="8" fill="#EEF4EC" stroke="#4B7A3B" stroke-width="1.8"/>
            <!-- 보랭팩 + 안정 온도 -->
            <rect x="34" y="34" width="38" height="28" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
            <text x="53" y="51" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="800">❄️ 보랭팩</text>
            <path d="M80 48H108" stroke="#4B7A3B" stroke-width="3" stroke-linecap="round"/>
            <text x="94" y="40" text-anchor="middle" fill="#4B7A3B" font-size="10" font-weight="800">정온 유지</text>
            <!-- 체크 배지 -->
            <circle cx="114" cy="22" r="11" fill="#4B7A3B"/>

    const ITEM_LIST = [ITEMS_DATA.spinach, ITEMS_DATA.mandarin, ITEMS_DATA.mackerel];

    /**
     * 2. 앱 상태 관리 (필터, 알림 신청, 투표 상태)
     */
    const appState = {
      selectedStageFilter: '전체',
      alertSubscribed: false,
      pollChoice: null,
      customPollText: '',
      showCustomInput: false,
      ignoreQueryParam: false
    };

    /**
     * 3. 유틸리티: 커스텀 안내 토스트 (alert() 절대 미사용)
     */
    function showToast(message, duration = 3200) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-[#222222]/95 text-white text-[13px] font-medium px-4 py-3 rounded-2xl shadow-lg text-center leading-snug backdrop-blur-sm transition-all duration-300 opacity-0 translate-y-2';
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    /**
     * 4. 유틸리티: 공유하기 (Web Share API -> 실패 시 클립보드 복사)
     */
    async function handleShareReport() {
      const shareData = {
        title: '이마트 월간 신선 품질 개선 리포트 〈이번 달, 이렇게 바꿨어요〉',
        text: '2026년 11월호 · 이마트 신선 품질 개선 리포트를 확인해 보세요.',
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (err) {
          // 사용자가 취소한 경우 무시, 그 외 폴백 실행
          if (err && err.name === 'AbortError') return;
        }
      }

      // 클립보드 복사 폴백 (iFrame 호환 document.execCommand 사용)
      try {
        const tempInput = document.createElement('input');
        tempInput.value = window.location.href;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast('리포트 링크가 복사되었어요!');
      } catch (e) {
        showToast('링크 복사에 실패했어요. 주소창의 링크를 공유해 주세요.');
      }
    }

    /**
     * 5. 공통 컴포넌트: 4구간 막대 (입고 · 보관 · 포장 · 배송)
     */
    function renderStageBar(activeStage, compact = false) {
      return `
        <div class="grid grid-cols-4 gap-1.5 ${compact ? 'mt-2.5' : 'mt-3'}">
          ${STAGES.map(stage => {
            const isActive = stage === activeStage;
            return `
              <div class="flex flex-col items-center">
                <div class="w-full ${compact ? 'h-2' : 'h-2.5'} rounded-full transition-colors ${isActive ? 'bg-[#4B7A3B]' : 'bg-gray-200'}"></div>
                <span class="${compact ? 'text-[11px] mt-1' : 'text-[12px] mt-1.5'} ${isActive ? 'font-bold text-[#4B7A3B]' : 'font-medium text-gray-400'}">
                  ${stage}
                </span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    /**
     * 6. 공통 컴포넌트: 하단 푸터 안내 문구
     */
    function renderFooter(extraBottomSpace = false) {
      return `
        <footer class="bg-gray-50 border-t border-gray-200/80 px-5 pt-5 ${extraBottomSpace ? 'pb-28' : 'pb-8'} mt-auto">
          <p class="text-[11px] text-gray-500 leading-relaxed">
            FNDA 이마트 개인과제 콘셉트 시안입니다. 화면 속 고객 문의·수치는 예시이며, 개선 효과는 목표값이에요. 실제 주문·알림 기능은 작동하지 않아요.
          </p>
        </footer>
      `;
    }

    /**
     * 7. 라우팅 파싱 & 내비게이션
     */
    function getCurrentRoute() {
      const hash = window.location.hash.replace('#', '').trim().toLowerCase();
      if (hash && ITEMS_DATA[hash]) {
        return { view: 'detail', itemId: hash };
      }

      if (!appState.ignoreQueryParam) {
        const params = new URLSearchParams(window.location.search);
        const queryItem = (params.get('item') || '').trim().toLowerCase();
        if (queryItem && ITEMS_DATA[queryItem]) {
          return { view: 'detail', itemId: queryItem };
        }
      }

      return { view: 'report' };
    }

    function navigateTo(routeHash) {
      appState.ignoreQueryParam = true;
      try {
        if (routeHash) {
          window.location.hash = routeHash;
        } else if (window.location.hash) {
          window.location.hash = '';
        }
      } catch (e) {
        // 샌드박스 환경 예외 무시
      }
      renderApp();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    /**
     * 8. 화면 1: 품목 상세 화면 (QR 진입용 - 시금치 / 감귤 / 고등어)
     */
    function renderDetailView(itemId) {
      const item = ITEMS_DATA[itemId];
      const otherItems = ITEM_LIST.filter(i => i.id !== itemId);

      return `
        <div class="flex-1 flex flex-col fade-in">
          <!-- ① 상단 바 (스크롤 고정 + 노란 선) -->
          <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b-[3px] border-[#FFB81C] px-4 py-3 flex items-center justify-between">
            <button type="button" onclick="navigateTo('')" class="flex items-center gap-1 text-[15px] font-bold text-[#222222] py-1 px-1.5 -ml-1.5 rounded-lg active:bg-gray-100 transition">
              <span class="text-xl leading-none font-normal text-gray-600">‹</span>
              <span>11월 리포트</span>
            </button>
            <span class="inline-flex items-center gap-1 bg-[#EEF4EC] text-[#4B7A3B] text-[12px] font-bold px-2.5 py-1 rounded-full">
              <span>📍</span> 단골 점포
            </span>
          </header>

          <!-- 본문 컨텐츠 -->
          <main class="px-5 pt-6 pb-6 space-y-6">
            
            <!-- ② 상품 헤더 -->
            <section>
              <div class="sticker-bubble mb-3.5">
                <span>🌱</span>
                <span>이번 달, 이렇게 바꿨어요!</span>
              </div>
              <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="w-14 h-14 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-3xl shadow-sm shrink-0">
                    ${item.emoji}
                  </div>
                  <div>
                    <h1 class="text-[24px] font-extrabold tracking-tight text-[#222222] leading-tight">
                      ${item.name}
                    </h1>
                    <p class="text-[13px] text-gray-500 font-medium mt-0.5">
                      ${item.completedDate}
                    </p>
                  </div>

                    참여해 주셔서 고마워요. (시안 화면이라 결과는 예시예요)
                  </p>
                </div>
              `}
            </section>

            <!-- ⑦ 이마트의 약속 -->
            <section class="bg-[#EEF4EC]/70 border border-[#4B7A3B]/20 rounded-[16px] p-4 space-y-2.5">
              <h2 class="text-[15px] font-extrabold text-[#4B7A3B]">이마트의 약속</h2>
              <ul class="space-y-2 text-[13px] font-semibold text-[#222222]">
                <li class="flex items-start gap-2">
                  <span class="text-[#4B7A3B] font-extrabold">✓</span>
                  <span>실제로 고친 상품만 알려드려요</span>
                </li>
                <li class="flex items-start gap-2">
                  <span class="text-[#4B7A3B] font-extrabold">✓</span>
                  <span>어느 구간에서 문제가 생겼는지 솔직하게 보여드려요</span>
                </li>
                <li class="flex items-start gap-2">
                  <span class="text-[#4B7A3B] font-extrabold">✓</span>
                  <span>매달 1회, 같은 날 발행해요</span>
                </li>
              </ul>
            </section>

          </main>

          <!-- ⑧ 푸터 -->
          ${renderFooter(false)}
        </div>
      `;
    }

    /**
     * 10. 인터랙션 핸들러 (필터, 스크롤, 알림, 투표)
     */
    function setStageFilter(stage) {
      appState.selectedStageFilter = stage;
      renderApp();
    }

    function scrollToNextMonth() {
      const el = document.getElementById('next-month-section');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function toggleAlertSubscribe() {
      appState.alertSubscribed = !appState.alertSubscribed;
      renderApp();
      if (appState.alertSubscribed) {
        showToast('12월호 발행 알림이 신청되었어요. (시안 안내)');
      }
    }

    function submitPoll(choice) {
      appState.pollChoice = choice;
      renderApp();
    }

    function toggleCustomPollInput() {
      appState.showCustomInput = !appState.showCustomInput;
      renderApp();
      if (appState.showCustomInput) {
        setTimeout(() => {
          const input = document.getElementById('custom-poll-input');
          if (input) input.focus();
        }, 50);
      }
    }

    function submitCustomPoll() {
      const input = document.getElementById('custom-poll-input');
      const val = input ? input.value.trim() : '';
      if (!val) {
        showToast('원하시는 신선 상품을 입력해 주세요.');
        return;
      }
      appState.customPollText = val;
      appState.pollChoice = '직접입력';
      renderApp();
    }

    /**
     * 11. 메인 렌더링 엔진 & 브라우저 히스토리 리스너
     */
    function renderApp() {
      const root = document.getElementById('app-root');
      const route = getCurrentRoute();

      if (route.view === 'detail') {
        root.innerHTML = renderDetailView(route.itemId);
      } else {
        root.innerHTML = renderReportView();
      }
    }

    window.addEventListener('hashchange', renderApp);
    window.addEventListener('popstate', renderApp);
    window.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
